                    <form onSubmit={handleCheck} className="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-10 max-w-lg mx-auto">
                        <input type="text" placeholder="Masukkan Order ID atau ID Kursi (Contoh: VIP-26-010)" className="flex-1 bg-black border border-gray-700 focus:border-posera-gold rounded-xl px-5 py-3 text-white uppercase text-center text-[11px] sm:text-sm outline-none" value={orderId} onChange={e => setOrderId(e.target.value)} />
                        <button type="submit" className="bg-posera-red hover:bg-red-800 px-6 py-3 rounded-xl font-bold text-sm sm:text-base transition">Cari</button>
                    </form>

                    {order && (
                        <div className="bg-posera-gray p-6 rounded-3xl border border-gray-800 shadow-2xl fade-in">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-800 pb-4 mb-6 gap-3">
                                <div>
                                    <h3 className="text-xl font-bold">{order.name}</h3>
                                    <p className="text-posera-gold font-mono">{order.orderId}</p>
                                    <p className="text-xs text-gray-400 mt-1">Metode: <span className="uppercase text-white font-bold">{order.paymentMethod || 'BNI'}</span></p>
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    <span className={`px-4 py-1.5 rounded-full text-xs font-bold uppercase ${order.status === 'PAID' ? 'bg-green-900/50 text-green-400' : order.status === 'EXPIRED' ? 'bg-red-900/50 text-red-400' : order.status === 'CANCELLED' ? 'bg-red-900/50 text-red-400' : 'bg-yellow-900/50 text-yellow-400'}`}>
                                        {order.status === 'EXPIRED' ? 'KADALUARSA (EXPIRED)' : order.status === 'CANCELLED' ? 'DIBATALKAN (CANCELLED)' : order.status}
                                    </span>
                                    {order.paymentMethod === 'BOOKING' && order.status === 'WAITING_VERIFICATION' && (
                                        <PaymentCountdown createdAt={order.createdAt} />
                                    )}
                                    {order.status === 'WAITING_VERIFICATION' && (
                                        <button 
                                            onClick={handleCancelOrder} 
                                            disabled={isCancelling}
                                            className="bg-red-800 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow mt-2"
                                        >
                                            {isCancelling ? <div className="loader w-3 h-3 border-2"></div> : <><i className="fas fa-times-circle"></i> Batalkan Pesanan</>}
                                        </button>
                                    )}
                                </div>
                            </div>
                            
                            {order.status === 'EXPIRED' && (
                                <div className="bg-red-950/40 border border-red-800/60 p-4 rounded-xl text-center text-red-300 text-sm mb-6">
                                    <i className="fas fa-ban mr-2"></i> Batas waktu pembayaran 24 jam telah terlewati. Pesanan dibatalkan otomatis dan kursi telah dikembalikan ke sistem.
                                </div>
                            )}

                            {order.status === 'CANCELLED' && (
                                <div className="bg-red-950/40 border border-red-800/60 p-4 rounded-xl text-center text-red-300 text-sm mb-6">
                                    <i className="fas fa-ban mr-2"></i> Pesanan ini telah dibatalkan oleh pemesan. Kursi sudah dikembalikan dan tersedia untuk dipesan kembali.
                                </div>
                            )}

                            {order.status === 'PAID' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {order.tickets.map((t, idx) => {
                                        const catColor = t.cat === 'VIP' ? 'text-green-500' : t.cat === 'REGULER' ? 'text-red-500' : 'text-yellow-500';
                                        const borderColor = t.cat === 'VIP' ? 'border-green-500/30' : t.cat === 'REGULER' ? 'border-red-500/30' : 'border-yellow-500/30';
                                        
                                        return (
                                        <div key={idx} className="flex flex-col gap-3">
                                            <div id={`ticket-${t.qrToken}`} className="bg-black rounded-2xl border border-gray-800 overflow-hidden flex flex-col sm:flex-row relative shadow-lg">
                                                <div className="sm:w-2/5 w-full bg-gray-900 border-b sm:border-b-0 sm:border-r border-gray-800 relative h-36 sm:h-auto flex flex-col justify-center items-center p-4">
                                                    <img src="WhatsApp Image 2026-08-18 at 09.03.04.jpeg" alt="Logo" className="absolute inset-0 w-full h-full object-cover opacity-30 blur-[2px]" onError={(e)=>{e.target.style.display='none';}} />
                                                    <div className={`relative z-10 text-center bg-black/80 p-3 rounded-xl w-full border ${borderColor}`}>
                                                        <p className={`font-bold uppercase tracking-widest mb-1 text-xs ${catColor}`}>{t.cat}</p>
                                                        <p className="text-2xl sm:text-3xl font-cinematic font-bold text-white drop-shadow-md">{t.seat}</p>
                                                        <p className="text-[10px] text-gray-400 mt-1">Nomor Kursi Teater</p>
                                                    </div>
                                                </div>
                                                <div className="p-5 flex-1 flex flex-col items-center justify-center relative bg-[#0a0a0a]">
                                                    <div className="w-full bg-white p-3 rounded-xl flex flex-col items-center gap-3 border border-gray-300 mt-2">
                                                        <BarcodeDisplay value={t.qrToken} />
                                                        <QRCodeDisplay value={t.qrToken} />
                                                    </div>
                                                    <p className="text-[10px] text-gray-500 font-mono mt-3 border-t border-gray-800 pt-2 w-full text-center">Token: {t.qrToken}</p>
                                                    {t.status === 'USED' && (
                                                        <p className="text-xs text-green-500 font-bold mt-2"><i className="fas fa-check-circle"></i> SUDAH CHECK-IN</p>
                                                    )}
                                                </div>
                                            </div>
                                            
                                            <button onClick={() => handleDownloadTicket(t.qrToken, t.seat)} className="w-full bg-posera-gold hover:bg-yellow-600 text-black font-bold py-2.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                                                <i className="fas fa-download"></i> Simpan Gambar Tiket
                                            </button>
                                        </div>
                                    )})}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const AdminLoginView = ({ onLogin, navigate, setToast }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            return (
                <div className="min-h-screen flex items-center justify-center bg-cinematic px-4">
                    <form onSubmit={(e) => { e.preventDefault(); if(user==='admin'&&pass==='poserasemur') onLogin(); else setToast('Login Salah', 'error'); }} className="bg-posera-gray p-8 sm:p-10 rounded-3xl border border-gray-800 w-full max-w-md">
                        <h2 className="text-2xl sm:text-3xl font-cinematic text-posera-gold font-bold text-center mb-6">ADMIN PANEL</h2>
                        <input type="text" placeholder="Username" className="w-full bg-black border border-gray-700 focus:border-posera-gold outline-none rounded-xl p-4 text-white mb-4 text-sm sm:text-base" value={user} onChange={e=>setUser(e.target.value)} required />
                        <input type="password" placeholder="Password" className="w-full bg-black border border-gray-700 focus:border-posera-gold outline-none rounded-xl p-4 text-white mb-6 text-sm sm:text-base" value={pass} onChange={e=>setPass(e.target.value)} required />
                        <button type="submit" className="w-full bg-posera-red hover:bg-red-800 transition py-4 rounded-xl font-bold mb-4">Login</button>
                        <button type="button" onClick={() => navigate('home')} className="w-full text-gray-400 text-sm hover:text-white transition">Kembali</button>
                    </form>
                </div>
            );
        };

        const AdminDashboard = ({ navigate, setToast }) => {
            const [view, setView] = useState(() => localStorage.getItem('posera_admin_view') || 'orders');
            const [settings, setSettings] = useState({ qrisImageUrl: "" });
            const [qrisInput, setQrisInput] = useState('');
            const [orders, setOrders] = useState([]);
            const [seats, setSeats] = useState([]);
            
            const [selectedOrderIds, setSelectedOrderIds] = useState([]);
            const [previewImage, setPreviewImage] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const isScanningRef = useRef(false);
            const [filterStatus, setFilterStatus] = useState('ALL');

            useEffect(() => {
                localStorage.setItem('posera_admin_view', view);
            }, [view]);

            const fetchAdminData = async () => {
                const st = await DB.getSettings();
                const ord = await DB.getOrders();
                const sts = await DB.getSeats();
                
                for (let o of ord) {
                    if (o.paymentMethod === 'BOOKING' && o.status === 'WAITING_VERIFICATION') {
                        const createdTime = new Date(o.createdAt).getTime();
                        const expiryTime = createdTime + (24 * 60 * 60 * 1000);
                        if (new Date().getTime() > expiryTime) {
                            await DB.updateOrderStatus(o.firestoreId, o.orderId, 'EXPIRED');
                            o.status = 'EXPIRED';
                        }
                    }
                }

                setSettings(st);
                setQrisInput(st.qrisImageUrl || '');
                setOrders(ord);
                setSeats(sts);
            };

            useEffect(() => {
                fetchAdminData();
            }, [view]);

            useEffect(() => {
                let scanner = null;
                if (view === 'scan') {
                    setTimeout(() => {
                        scanner = new window.Html5QrcodeScanner(
                            "qr-reader-admin", 
                            { fps: 10, qrbox: {width: 250, height: 250}, rememberLastUsedCamera: true }, 
                            false
                        );
                        scanner.render(
                            async (decodedText) => {
                                if (isScanningRef.current) return;
                                isScanningRef.current = true;
                                
                                try {
                                    const res = await DB.checkIn(decodedText);
                                    if (res.success) {
                                        setToast(`✅ ${res.msg} - Kursi ${res.data.seat} (${res.data.orderName})`, 'success');
                                        await fetchAdminData(); 
                                    } else {
                                        setToast(`❌ ${res.msg}`, 'error');
                                    }
                                } catch (error) {
                                    setToast('Sistem error saat memproses tiket', 'error');
                                }
                                setTimeout(() => { isScanningRef.current = false; }, 3000);
                            },
                            (err) => { }
                        );
                    }, 200);
                }
                
                return () => {
                    if (scanner) {
                        scanner.clear().catch(e => console.error("Gagal membersihkan scanner", e));
                    }
                };
            }, [view]);

            const handleSyncSeats = async () => {
                if(!confirm("Yakin ingin mensinkronkan ulang (Kunci) kursi dengan data pesanan?")) return;
                
                setIsSyncing(true);
                try {
                    const { db, doc, getDoc, setDoc } = window.FB;
                    const seatDocRef = doc(db, "posera_config", "seats");
                    const snap = await getDoc(seatDocRef);
                    if(!snap.exists()) throw new Error("Gagal mengambil konfigurasi kursi");
                    let seatsList = snap.data().list;
                    
                    seatsList.forEach(s => s.status = 'AVAILABLE');
                    orders.forEach(o => {
                        if(o.status === 'WAITING_VERIFICATION') {
                            o.tickets?.forEach(t => {
                                const idx = seatsList.findIndex(s => s.id === t.seat);
                                if(idx > -1) { seatsList[idx].status = 'RESERVED'; }
                            });
                        }
                    });
                    orders.forEach(o => {
                        if(o.status === 'PAID') {
                            o.tickets?.forEach(t => {
                                const idx = seatsList.findIndex(s => s.id === t.seat);
                                if(idx > -1) { seatsList[idx].status = 'SOLD'; }
                            });
                        }
                    });
                    
                    await setDoc(seatDocRef, { list: seatsList });
                    setSeats(seatsList);
                    setToast('Sinkronisasi Kunci Berhasil! Tiket Lunas telah dikunci penuh.', 'success');
                } catch(e) {
                    setToast('Gagal melakukan sinkronisasi: ' + e.message, 'error');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleStatusChange = async (orderId, status) => {
                if(confirm(`Yakin merubah status pesanan ini menjadi ${status}?`)) {
                    await DB.updateOrderStatus(null, orderId, status);
                    setToast('Status berhasil diubah', 'success');
                    const ord = await DB.getOrders();
                    setOrders(ord);
                }
            };

            const handleSelectAll = (e) => {
                if (e.target.checked) setSelectedOrderIds(filteredOrders.map(o => o.orderId));
                else setSelectedOrderIds([]);
            };

            const handleCheckboxChange = (orderId) => {
                if (selectedOrderIds.includes(orderId)) setSelectedOrderIds(selectedOrderIds.filter(id => id !== orderId));
                else setSelectedOrderIds([...selectedOrderIds, orderId]);
            };

            const handleBulkVerify = async () => {
                if (selectedOrderIds.length === 0) return setToast('Pilih pesanan terlebih dahulu', 'error');
                if (confirm(`Verifikasi (PAID) ${selectedOrderIds.length} pesanan terpilih?`)) {
                    for (let id of selectedOrderIds) {
                        await DB.updateOrderStatus(null, id, 'PAID');
                    }
                    setToast('Pesanan terpilih berhasil diverifikasi', 'success');
                    setSelectedOrderIds([]);
                    const ord = await DB.getOrders();
                    setOrders(ord);
                }
            };

            const handleBulkDelete = async () => {
                if (selectedOrderIds.length === 0) return setToast('Pilih pesanan terlebih dahulu', 'error');
                if (confirm(`Hapus ${selectedOrderIds.length} pesanan terpilih? Kursi akan dikembalikan menjadi tersedia.`)) {
                    await DB.deleteOrders(selectedOrderIds);
                    setToast('Pesanan terpilih berhasil dihapus', 'success');
                    setSelectedOrderIds([]);
                    const ord = await DB.getOrders();
                    setOrders(ord);
                }
            };

            const handleExportCheckIn = () => {
                const checkInData = [];
                orders.forEach(o => {
                    if (o.tickets) {
                        o.tickets.forEach(t => {
                            if (t.status === 'USED') {
                                checkInData.push({
                                    "Order ID": o.orderId,
                                    "Nama Pemesan": o.name,
                                    "No WA": o.wa,
                                    "ID Kursi": t.seat,
                                    "Kategori": t.cat,
                                    "Waktu Check-in": new Date(t.usedAt).toLocaleString('id-ID')
                                });
                            }
                        });
                    }
                });

                if (checkInData.length === 0) return setToast('Belum ada tiket yang ter-scan / check-in', 'error');

                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(checkInData), "Daftar Hadir");
                window.XLSX.writeFile(wb, "Rekapan_CheckIn_Sangkala.xlsx");
                setToast('File Rekapan Check-in berhasil didownload', 'success');
            };

            const handleExportExcel = () => {
                if (orders.length === 0) return setToast('Belum ada data pesanan', 'error');
                const wb = window.XLSX.utils.book_new();
                const processCategory = (categoryName) => {
                    const rows = [];
                    orders.forEach(o => {
                        if (o.tickets) {
                            o.tickets.forEach(t => {
                                if (t.cat === categoryName) {
                                    rows.push({
                                        "Order ID": o.orderId,
                                        "Nama Pemesan": o.name,
                                        "No WA": o.wa,
                                        "Email": o.email,
                                        "ID Kursi": t.seat,
                                        "Kategori": t.cat,
                                        "Harga": t.price,
                                        "Metode Bayar": o.paymentMethod,
                                        "Status Order": o.status,
                                        "Waktu Order": new Date(o.createdAt).toLocaleString('id-ID'),
                                        "Status Kehadiran": t.status === 'USED' ? 'SUDAH HADIR' : 'BELUM HADIR',
                                        "Waktu Check-in": t.usedAt ? new Date(t.usedAt).toLocaleString('id-ID') : '-'
                                    });
                                }
                            });
                        }
                    });
                    return rows;
                };

                const dataVIP = processCategory('VIP');
                const dataREG = processCategory('REGULER');
                const dataUMUM = processCategory('UMUM');

                if (dataVIP.length > 0) window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(dataVIP), "Data VIP");
                if (dataREG.length > 0) window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(dataREG), "Data REGULER");
                if (dataUMUM.length > 0) window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(dataUMUM), "Data UMUM");

                if (wb.SheetNames.length === 0) return setToast('Tidak ada tiket yang bisa diexport', 'error');
                window.XLSX.writeFile(wb, "Rekapan_Tiket_Sangkala.xlsx");
                setToast('File Rekapan Excel berhasil didownload', 'success');
            };

            const handleResetDatabase = async () => {
                const confirmation = prompt('⚠️ PERHATIAN BAHAYA!\nTindakan ini akan MENGHAPUS SEMUA PESANAN secara permanen dan MENGOSONGKAN SELURUH KURSI.\n\nKetik "RESET" (tanpa tanda kutip) untuk melanjutkan:');
                if (confirmation === 'RESET') {
                    try {
                        await DB.resetDatabase();
                        setToast('Database berhasil direset bersih!', 'success');
                        const ord = await DB.getOrders();
                        const sts = await DB.getSeats();
                        setOrders(ord);
                        setSeats(sts);
                        setSelectedOrderIds([]);
                    } catch (error) {
                        setToast('Gagal mereset: ' + error.message, 'error');
                    }
                } else if (confirmation !== null) {
                    setToast('Konfirmasi salah, reset dibatalkan.', 'error');
                }
            };
            
            // FUNGSI HELPER UNTUK WHATSAPP TEMPLATE
            const formatWA = (phone) => {
                if (!phone) return '';
                let formatted = phone.replace(/\D/g, ''); // Hapus semua karakter non-angka
                if (formatted.startsWith('0')) {
                    formatted = '62' + formatted.substring(1); // Ubah 0 jadi 62
                }
                return formatted;
            };

            const sendWA = (order, type) => {
                const phone = formatWA(order.wa);
                if (!phone || phone.length < 9) {
                    setToast("Nomor WhatsApp tidak valid!", 'error');
                    return;
                }
                
                const seatsList = order.tickets ? order.tickets.map(t => t.seat).join(', ') : '';
                let text = '';
                
                if (type === 'success') {
                    text = `Halo ${order.name},\n\nTerima kasih sudah memesan tiket POSERA dengan judul naskah "SANGKALA".\n\nDetail Pesanan Anda:\n• Order ID: *${order.orderId}*\n• Nomor Tiket/Kursi: *${seatsList}*\n\nTerima kasih! 🙏`;
                } else if (type === 'double') {
                    text = `Mohon maaf Bapak/Ibu ${order.name},\n\nKarena adanya masalah pada sistem kami, nomor tiket yang Anda pesan (*${seatsList}*) tertimpa dengan data pemesan lainnya.\n\nMohon konfirmasinya apakah berkenan untuk diganti dengan nomor kursi yang masih tersedia, atau ingin melakukan proses pembatalan/refund? Sekali lagi kami mohon maaf atas ketidaknyamanan ini. 🙏`;
                } else {
                    text = `Halo ${order.name}, `; // Chat kosong / manual
                }
                
                // Buka tab baru ke WhatsApp web/app
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
            };

            const filteredOrders = orders.filter(o => filterStatus === 'ALL' || o.status === filterStatus);

            return (
                <div className="flex flex-col md:flex-row h-screen bg-[#050505] overflow-hidden">
                    <div className="w-full md:w-64 bg-posera-gray border-b md:border-b-0 md:border-r border-gray-800 p-3 md:p-4 flex md:flex-col justify-between items-center md:items-stretch overflow-x-auto shrink-0 hide-scrollbar">
                        <h2 className="text-lg md:text-xl font-cinematic font-bold text-posera-gold p-2 md:p-4 text-center shrink-0 mr-4 md:mr-0">ADMIN</h2>
                        <div className="flex md:flex-col gap-2 w-full shrink-0">
                            <button onClick={() => setView('orders')} className={`text-left p-2.5 md:p-3 rounded text-xs md:text-sm font-medium whitespace-nowrap ${view === 'orders' ? 'bg-posera-red text-white' : 'text-gray-300 hover:bg-gray-800'}`}>Pesanan</button>
                            <button onClick={() => setView('settings')} className={`text-left p-2.5 md:p-3 rounded text-xs md:text-sm font-medium whitespace-nowrap ${view === 'settings' ? 'bg-posera-red text-white' : 'text-gray-300 hover:bg-gray-800'}`}>Pengaturan & Kunci</button>
                            <button onClick={() => setView('scan')} className={`text-left p-2.5 md:p-3 rounded text-xs md:text-sm font-medium whitespace-nowrap ${view === 'scan' ? 'bg-posera-red text-white' : 'text-gray-300 hover:bg-gray-800'}`}>Check-in / Scanner</button>
                            
                            <button onClick={() => { 
                                localStorage.removeItem('adminAuth'); 
                                localStorage.removeItem('posera_admin_view');
                                navigate('home'); 
                            }} className="text-left p-2.5 md:p-3 rounded text-xs md:text-sm font-bold text-red-400 hover:bg-red-900/30 whitespace-nowrap md:mt-10 transition">Logout</button>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 md:p-8 relative">
                        {view === 'orders' && (
                            <div className="fade-in">
                                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4 border-b border-gray-800 pb-4">
                                    <h1 className="text-xl md:text-2xl font-bold flex flex-wrap items-center gap-4">
                                        Manajemen Pesanan 
                                        <button onClick={handleExportExcel} className="bg-green-700 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-lg flex items-center gap-2">
                                            <i className="fas fa-file-excel"></i> Export Rekapan Excel
                                        </button>
                                    </h1>
                                    
                                    <div className="flex flex-wrap gap-3 items-center w-full lg:w-auto">
                                        <div className="flex items-center gap-2 bg-gray-900 border border-gray-700 rounded-lg p-1">
                                            <span className="text-xs text-gray-400 pl-2">Filter:</span>
                                            <select 
                                                value={filterStatus} 
                                                onChange={(e) => setFilterStatus(e.target.value)}
                                                className="bg-transparent text-white text-xs p-1 outline-none font-bold"
                                            >
                                                <option value="ALL">Semua Tiket</option>
                                                <option value="PAID">Sudah Lunas (PAID)</option>
                                                <option value="WAITING_VERIFICATION">Menunggu Verifikasi</option>
                                                <option value="EXPIRED">Kadaluarsa</option>
                                                <option value="CANCELLED">Dibatalkan</option>
                                            </select>
                                        </div>

                                        {selectedOrderIds.length > 0 && (
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={handleBulkVerify} className="bg-green-600 hover:bg-green-700 text-white px-3 md:px-4 py-1.5 rounded-lg text-xs font-bold transition shadow">
                                                    <i className="fas fa-check-circle mr-1"></i> Verif ({selectedOrderIds.length})
                                                </button>
                                                <button onClick={handleBulkDelete} className="bg-red-600 hover:bg-red-700 text-white px-3 md:px-4 py-1.5 rounded-lg text-xs font-bold transition shadow">
                                                    <i className="fas fa-trash-alt mr-1"></i> Hapus ({selectedOrderIds.length})
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="bg-posera-gray rounded-xl overflow-x-auto border border-gray-800 shadow-xl">
                                    <table className="w-full text-left text-xs md:text-sm whitespace-nowrap">
                                        <thead className="bg-black text-gray-400">
                                            <tr>
                                                <th className="p-3 md:p-4 w-10 text-center">
                                                    <input type="checkbox" onChange={handleSelectAll} checked={filteredOrders.length > 0 && selectedOrderIds.length === filteredOrders.length} className="cursor-pointer accent-posera-red w-4 h-4" />
                                                </th>
                                                <th className="p-3 md:p-4">ID Transaksi</th>
                                                <th className="p-3 md:p-4 min-w-[200px]">Nama / Detail Nomor Kursi</th>
                                                <th className="p-3 md:p-4">Metode & Bukti</th>
                                                <th className="p-3 md:p-4">Status</th>
                                                <th className="p-3 md:p-4 text-center">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-800">
                                            {filteredOrders.map(o => (
                                                <tr key={o.orderId} className="hover:bg-gray-900/50 transition">
                                                    <td className="p-3 md:p-4 text-center">
                                                        <input type="checkbox" checked={selectedOrderIds.includes(o.orderId)} onChange={() => handleCheckboxChange(o.orderId)} className="cursor-pointer accent-posera-red w-4 h-4" />
                                                    </td>
                                                    <td className="p-3 md:p-4 font-mono text-posera-gold font-bold">{o.orderId}</td>
                                                    <td className="p-3 md:p-4">
                                                        <div className="font-bold text-white text-sm">{o.name}</div>
                                                        <div className="text-[11px] text-gray-400 mb-1">{o.wa}</div>
                                                        
                                                        {/* TOMBOL KONTAK WHATSAPP (Req 1,2,3,4) */}
                                                        <div className="flex flex-wrap gap-1 mb-2">
                                                            <button onClick={() => sendWA(o, 'success')} className="bg-green-600/80 hover:bg-green-500 text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 transition" title="Kirim WA Konfirmasi">
                                                                <i className="fab fa-whatsapp"></i> Konfirmasi
                                                            </button>
                                                            <button onClick={() => sendWA(o, 'double')} className="bg-orange-600/80 hover:bg-orange-500 text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 transition" title="Kirim WA Masalah Double">
                                                                <i className="fab fa-whatsapp"></i> Info Double
                                                            </button>
                                                            <button onClick={() => sendWA(o, 'chat')} className="bg-gray-700 hover:bg-gray-600 text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 transition" title="Mulai Chat Biasa">
                                                                <i className="fab fa-whatsapp"></i> Chat
                                                            </button>
                                                        </div>

                                                        <div className="flex flex-wrap gap-1 max-w-[200px]">
                                                            {o.tickets && o.tickets.map((t, idx) => (
                                                                <span key={idx} title={t.status === 'USED' ? `Check-in: ${new Date(t.usedAt).toLocaleString('id-ID')}` : 'Belum Check-in'} className={`px-1.5 py-0.5 rounded text-[10px] font-mono border font-bold ${t.cat === 'VIP' ? 'bg-green-900/30 text-green-400 border-green-800' : t.cat === 'REGULER' ? 'bg-red-900/30 text-red-400 border-red-800' : 'bg-yellow-900/30 text-yellow-400 border-yellow-800'} ${t.status === 'USED' ? 'opacity-50' : ''}`}>
                                                                    {t.seat} {t.status === 'USED' && '✅'}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </td>
                                                    <td className="p-3 md:p-4">
                                                        <div className="text-[11px] font-bold uppercase text-gray-300 mb-1">{o.paymentMethod || 'BNI'}</div>
                                                        {o.paymentProof ? (
                                                            <button onClick={() => setPreviewImage(o.paymentProof)} className="bg-posera-gold/20 text-posera-gold border border-posera-gold/40 hover:bg-posera-gold hover:text-black transition px-2.5 py-1 rounded text-[11px] font-semibold flex items-center gap-1 w-fit">
                                                                <i className="fas fa-image"></i> Lihat Bukti
                                                            </button>
                                                        ) : (
                                                            <span className="text-[11px] text-gray-500 italic">{o.paymentMethod === 'BOOKING' ? 'Booking Offline' : 'Tidak ada foto'}</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 md:p-4">
                                                        <span className={`px-2.5 py-1 rounded-full text-[10px] md:text-xs font-bold uppercase ${o.status === 'PAID' ? 'bg-green-900/50 text-green-400 border border-green-700/50' : o.status === 'EXPIRED' ? 'bg-red-900/50 text-red-400 border border-red-700/50' : o.status === 'CANCELLED' ? 'bg-red-900/50 text-red-400 border border-red-700/50' : 'bg-yellow-900/50 text-yellow-400 border border-yellow-700/50'}`}>{o.status}</span>
                                                    </td>
                                                    <td className="p-3 md:p-4 text-center">
                                                        <div className="flex flex-col gap-1.5 min-w-[80px]">
                                                            {o.status === 'WAITING_VERIFICATION' && (
                                                                <button onClick={() => handleStatusChange(o.orderId, 'PAID')} className="bg-green-600 hover:bg-green-700 text-white px-2 py-1.5 rounded text-xs font-bold shadow transition w-full">Verifikasi</button>
                                                            )}
                                                            {(o.status === 'WAITING_VERIFICATION' || o.status === 'PAID') && (
                                                                <button onClick={() => handleStatusChange(o.orderId, 'CANCELLED')} className="bg-red-800 hover:bg-red-700 border border-red-600 text-white px-2 py-1.5 rounded text-xs font-bold shadow transition w-full">Batalkan</button>
                                                            )}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredOrders.length === 0 && <tr><td colSpan="6" className="text-center p-8 text-gray-500">Tidak ada data pesanan pada kategori ini.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="max-w-xl mx-auto space-y-6 fade-in">
                                <div className="bg-posera-gray p-6 rounded-2xl border border-gray-800">
                                    <h1 className="text-xl md:text-2xl font-bold mb-4">Pengaturan Web</h1>
                                    <form onSubmit={async (e) => { e.preventDefault(); await DB.updateSettings({...settings, qrisImageUrl: qrisInput}); setToast('Disimpan ke Firestore!', 'success'); }} className="space-y-4">
                                        <div><label className="text-xs text-gray-400">URL QRIS</label><input type="text" className="w-full bg-black border border-gray-700 focus:border-posera-gold outline-none p-3 rounded text-white text-sm" value={qrisInput} onChange={e=>setQrisInput(e.target.value)} /></div>
                                        <button type="submit" className="w-full bg-posera-gold hover:opacity-90 text-black py-3 rounded font-bold transition">Simpan</button>
                                    </form>
                                </div>

                                <div className="bg-posera-gray p-6 rounded-2xl border border-blue-900/50">
                                    <h1 className="text-xl md:text-2xl font-bold mb-2 text-blue-500">Sinkronisasi & Kunci Kursi (Fix Double Booking)</h1>
                                    <p className="text-sm text-gray-400 mb-4 leading-relaxed">
                                        Jika terjadi *bug double booking* atau kursi yang lunas kembali bisa dipesan. Tekan tombol ini. Sistem akan mendeteksi <b>semua pesanan Lunas (PAID)</b> dan <b>memaksa penguncian (SOLD)</b> secara absolut pada database.
                                    </p>
                                    <button onClick={handleSyncSeats} disabled={isSyncing} className="w-full bg-blue-700 hover:bg-blue-600 text-white py-3.5 rounded-lg font-bold transition shadow-lg flex justify-center items-center gap-2">
                                        {isSyncing ? <div className="loader"></div> : <><i className="fas fa-lock"></i> Sinkronkan & Kunci Kursi Lunas</>}
                                    </button>
                                </div>

                                <div className="bg-posera-gray p-6 rounded-2xl border border-red-900/50">
                                    <h1 className="text-xl md:text-2xl font-bold mb-2 text-red-500">Zona Berbahaya</h1>
                                    <p className="text-sm text-gray-400 mb-4 leading-relaxed">
                                        Fitur ini digunakan untuk persiapan rilis publik. Semua data pesanan yang pernah masuk akan <b>dihapus permanen</b> dan semua kursi (430 tiket) akan dikembalikan ke status <b>AVAILABLE</b>.
                                    </p>
                                    <button onClick={handleResetDatabase} className="w-full bg-red-900 hover:bg-red-700 text-white py-3.5 rounded-lg font-bold transition shadow-lg flex justify-center items-center gap-2">
                                        <i className="fas fa-radiation"></i> Reset Seluruh Database
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'scan' && (
                            <div className="max-w-4xl mx-auto fade-in">
                                <div className="flex flex-col lg:flex-row gap-6">
                                    <div className="w-full lg:w-1/2">
                                        <h1 className="text-xl md:text-2xl font-bold mb-4">Scanner QR/Barcode</h1>
                                        <p className="text-sm text-gray-400 mb-4">Silakan izinkan akses kamera jika browser memintanya. Pilih kamera yang sesuai dari menu dropdown di bawah (Mendukung Kamera Internal/Eksternal/Webcam).</p>
                                        <div id="qr-reader-admin" className="w-full min-h-[300px] border border-gray-700 rounded-xl overflow-hidden shadow-2xl"></div>
                                    </div>
                                    
                                    <div className="w-full lg:w-1/2 bg-posera-gray p-4 rounded-xl border border-gray-800">
                                        <div className="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
                                            <h2 className="text-lg font-bold text-posera-gold">Log Hadir Terkini</h2>
                                            <button onClick={handleExportCheckIn} className="bg-green-700 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-lg flex items-center gap-2">
                                                <i className="fas fa-download"></i> Unduh Hadir
                                            </button>
                                        </div>
                                        <div className="max-h-[400px] overflow-y-auto pr-2 hide-scrollbar">
                                            {orders.flatMap(o => (o.tickets || []).filter(t => t.status === 'USED').map(t => ({...t, name: o.name, orderId: o.orderId})))
                                                .sort((a, b) => new Date(b.usedAt) - new Date(a.usedAt)) 
                                                .map((t, idx) => (
                                                <div key={idx} className="bg-black p-3 rounded-lg mb-2 border border-gray-800 text-sm flex justify-between items-center fade-in">
                                                    <div>
                                                        <div className="font-bold text-white mb-0.5">{t.name}</div>
                                                        <div className="text-[10px] text-gray-400">
                                                            <i className="fas fa-clock mr-1"></i> 
                                                            {new Date(t.usedAt).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} WIB
                                                        </div>
                                                    </div>
                                                    <span className={`px-2.5 py-1 rounded-full text-xs font-bold border ${t.cat === 'VIP' ? 'bg-green-900/30 text-green-400 border-green-800' : t.cat === 'REGULER' ? 'bg-red-900/30 text-red-400 border-red-800' : 'bg-yellow-900/30 text-yellow-400 border-yellow-800'}`}>
                                                        {t.seat}
                                                    </span>
                                                </div>
                                            ))}
                                            
                                            {orders.flatMap(o => (o.tickets || []).filter(t => t.status === 'USED')).length === 0 && (
                                                <div className="text-center text-gray-500 text-sm mt-10">
                                                    <i className="fas fa-history text-3xl mb-3 block opacity-50"></i>
                                                    Belum ada tiket yang ter-scan / hadir.
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {previewImage && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
                                <div className="bg-posera-gray border border-gray-700 p-6 rounded-3xl max-w-lg w-full relative shadow-2xl flex flex-col items-center">
                                    <div className="w-full flex justify-between items-center mb-4 border-b border-gray-800 pb-3">
                                        <h3 className="text-base md:text-lg font-bold text-posera-gold">Bukti Pembayaran Pemesan</h3>
                                        <button onClick={() => setPreviewImage(null)} className="text-gray-400 hover:text-white text-xl font-bold px-2"><i className="fas fa-times"></i></button>
                                    </div>
                                    <div className="w-full bg-black p-2 rounded-xl flex justify-center border border-gray-800 max-h-[60vh] overflow-auto">
                                        <img src={previewImage} alt="Bukti Pembayaran" className="max-h-[50vh] object-contain rounded" />
                                    </div>
                                    <button onClick={() => setPreviewImage(null)} className="mt-6 w-full bg-white text-black font-bold py-2.5 rounded-xl hover:bg-gray-200 transition text-sm">Tutup</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [route, setRoute] = useState(() => {
                const savedRoute = localStorage.getItem('posera_app_route');
                return savedRoute ? JSON.parse(savedRoute) : { path: 'home', params: {} };
            });
            const [toast, setToast] = useState(null);
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('posera_app_route', JSON.stringify(route));
            }, [route]);

            useEffect(() => { 
                DB.init(); 
                if(localStorage.getItem('adminAuth') === 'true') setIsAdminAuth(true);

                const audio = new Audio('Beneath_the_Burning_Roof.mp3');
                audio.loop = true;
                audio.volume = 0.4;
                audioRef.current = audio;

                const startAudio = () => {
                    if (audio.paused) {
                        audio.play().then(() => {
                            setIsPlayingAudio(true);
                        }).catch((err) => {
                            console.log("Autoplay diblokir browser, menunggu interaksi pengguna.", err);
                        });
                    }
                };

                startAudio();

                const events = ['click', 'touchstart', 'scroll', 'keydown'];
                const unlockAudio = () => {
                    startAudio();
                    events.forEach(e => window.removeEventListener(e, unlockAudio));
                };
                events.forEach(e => window.addEventListener(e, unlockAudio, { once: true }));

                return () => {
                    audio.pause();
                };
            }, []);

            const toggleAudio = () => {
                if (audioRef.current) {
                    if (isPlayingAudio) {
                        audioRef.current.pause();
                        setIsPlayingAudio(false);
                    } else {
                        audioRef.current.play();
                        setIsPlayingAudio(true);
                    }
                }
            };

            const navigate = (path, params = {}) => { 
                window.scrollTo(0,0); 
                if (path === 'home') {
                    localStorage.removeItem('posera_admin_view');
                }
                setRoute({ path, params }); 
            };

            return (
                <div className="min-h-screen relative">
                    <button onClick={toggleAudio} className="fixed bottom-4 left-4 z-50 bg-black/70 border border-posera-gold/50 text-posera-gold px-3.5 py-2 rounded-full text-xs font-semibold backdrop-blur shadow-lg flex items-center gap-2 hover:bg-black transition">
                        <i className={`fas ${isPlayingAudio ? 'fa-volume-up animate-pulse' : 'fa-volume-mute'}`}></i>
                        <span className="hidden sm:inline">{isPlayingAudio ? 'Musik On' : 'Musik Off'}</span>
                    </button>

                    {route.path === 'home' && <HomeView navigate={navigate} />}
                    {route.path === 'buy' && <BuyTicketView navigate={navigate} setToast={(m,t)=>setToast({msg:m,type:t})} />}
                    {route.path === 'success' && <SuccessView navigate={navigate} params={route.params} />}
                    {route.path === 'check' && <CheckTicketView navigate={navigate} params={route.params} setToast={(m,t)=>setToast({msg:m,type:t})} />}
                    {route.path === 'admin' && (isAdminAuth ? <AdminDashboard navigate={navigate} setToast={(m,t)=>setToast({msg:m,type:t})} /> : <AdminLoginView navigate={navigate} setToast={(m,t)=>setToast({msg:m,type:t})} onLogin={()=>{setIsAdminAuth(true);localStorage.setItem('adminAuth','true');}} />)}
                    {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)} />}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
