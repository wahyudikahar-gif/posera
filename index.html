<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ==========================================
        // FIRESTORE DATABASE LAYER
        // ==========================================
        const DB = {
            init: async () => {
                if (!window.FB) return;
                const { db, doc, getDoc, setDoc } = window.FB;
                
                const seatDocRef = doc(db, "posera_config", "seats");
                const seatSnap = await getDoc(seatDocRef);
                // 80 (VIP) + 150 (REG) + 200 (UMUM) = 430 kursi
                if (!seatSnap.exists() || seatSnap.data().list.length !== 430) {
                    const seats = [];
                    for(let i=1; i<=80; i++) seats.push({ id: `VIP-26-${String(i).padStart(3,'0')}`, cat: 'VIP', status: 'AVAILABLE' });
                    for(let i=1; i<=150; i++) seats.push({ id: `REG-26-${String(i).padStart(3,'0')}`, cat: 'REGULER', status: 'AVAILABLE' });
                    for(let i=1; i<=200; i++) seats.push({ id: `UM-26-${String(i).padStart(3,'0')}`, cat: 'UMUM', status: 'AVAILABLE' });
                    await setDoc(seatDocRef, { list: seats });
                }

                const settingsRef = doc(db, "posera_config", "settings");
                const settingsSnap = await getDoc(settingsRef);
                if (!settingsSnap.exists()) {
                    await setDoc(settingsRef, {
                        priceVIP: 30000, 
                        priceREG: 20000, 
                        priceUM: 10000,
                        qrisImageUrl: "qris.jpeg" 
                    });
                }
            },

            getSeats: async () => {
                const { db, doc, getDoc } = window.FB;
                const snap = await getDoc(doc(db, "posera_config", "seats"));
                return snap.exists() ? snap.data().list : [];
            },

            getOrders: async () => {
                const { db, collection, getDocs } = window.FB;
                const snap = await getDocs(collection(db, "posera_orders"));
                let orders = [];
                snap.forEach(d => orders.push({ firestoreId: d.id, ...d.data() }));
                orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                return orders;
            },

            getSettings: async () => {
                const { db, doc, getDoc } = window.FB;
                const snap = await getDoc(doc(db, "posera_config", "settings"));
                const data = snap.exists() ? snap.data() : {};
                let qrisUrl = data.qrisImageUrl;
                if (!qrisUrl || qrisUrl.trim() === "" || qrisUrl.includes("WhatsApp")) {
                    qrisUrl = "qris.jpeg";
                }
                return {
                    priceVIP: data.priceVIP || 30000,
                    priceREG: data.priceREG || 20000,
                    priceUM: data.priceUM || 10000,
                    qrisImageUrl: qrisUrl
                };
            },

            updateSettings: async (newSettings) => {
                const { db, doc, setDoc } = window.FB;
                await setDoc(doc(db, "posera_config", "settings"), newSettings);
            },
            
            createOrder: async (order) => {
                const { db, doc, collection, addDoc, runTransaction } = window.FB;
                const seatDocRef = doc(db, "posera_config", "seats");

                await runTransaction(db, async (transaction) => {
                    const seatSnap = await transaction.get(seatDocRef);
                    if (!seatSnap.exists()) throw new Error("Konfigurasi kursi belum ada.");
                    
                    let seats = seatSnap.data().list;

                    for (let t of order.tickets) {
                        const seat = seats.find(s => s.id === t.seat);
                        if (!seat || seat.status !== 'AVAILABLE') {
                            throw new Error(`Maaf, kursi ${t.seat} baru saja dipesan orang lain. Silakan pilih kursi lain.`);
                        }
                    }

                    order.tickets.forEach(t => {
                        const idx = seats.findIndex(s => s.id === t.seat);
                        if(idx > -1) seats[idx].status = 'RESERVED';
                    });

                    transaction.update(seatDocRef, { list: seats });
                });

                order.createdAt = new Date().toISOString();
                await addDoc(collection(db, "posera_orders"), order);
            },
            
            updateOrderStatus: async (orderFirestoreId, orderId, status) => {
                const { db, doc, updateDoc, collection, getDocs, runTransaction, query, where, getDoc } = window.FB;
                
                let targetDocRef = null;
                let targetOrder = null;

                if (orderFirestoreId) {
                    targetDocRef = doc(db, "posera_orders", orderFirestoreId);
                    const snap = await getDoc(targetDocRef);
                    if (snap.exists()) targetOrder = snap.data();
                } else if (orderId) {
                    const q = query(collection(db, "posera_orders"), where("orderId", "==", orderId));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        targetDocRef = doc(db, "posera_orders", snap.docs[0].id);
                        targetOrder = snap.docs[0].data();
                    }
                }

                if (targetOrder && targetDocRef) {
                    targetOrder.status = status;
                    if (status === 'PAID') {
                        targetOrder.tickets = targetOrder.tickets.map(t => ({
                            ...t, 
                            qrToken: t.qrToken || `POS-${Math.random().toString(36).substring(2, 10).toUpperCase()}`,
                            status: 'VALID' 
                        }));
                    }

                    const seatDocRef = doc(db, "posera_config", "seats");
                    await runTransaction(db, async (transaction) => {
                        const seatSnap = await transaction.get(seatDocRef);
                        if(seatSnap.exists()) {
                            let seats = seatSnap.data().list;
                            let modified = false;

                            if (status === 'PAID') {
                                targetOrder.tickets.forEach(t => {
                                    const idx = seats.findIndex(s => s.id === t.seat);
                                    if(idx > -1) { seats[idx].status = 'SOLD'; modified = true; }
                                });
                            } else if (status === 'REJECTED' || status === 'CANCELLED' || status === 'EXPIRED') {
                                targetOrder.tickets.forEach(t => {
                                    const idx = seats.findIndex(s => s.id === t.seat);
                                    if(idx > -1 && seats[idx].status !== 'SOLD') { 
                                        seats[idx].status = 'AVAILABLE'; modified = true; 
                                    }
                                });
                            }
                            
                            if (modified) transaction.update(seatDocRef, { list: seats });
                        }
                    });

                    await updateDoc(targetDocRef, targetOrder);
                }
            },

            deleteOrders: async (orderIdsToDelete) => {
                const { db, doc, collection, getDocs, deleteDoc, runTransaction } = window.FB;
                
                const snap = await getDocs(collection(db, "posera_orders"));
                let ordersToDelete = [];
                snap.forEach(d => {
                    const orderData = d.data();
                    if (orderIdsToDelete.includes(orderData.orderId) || orderIdsToDelete.includes(d.id)) {
                        ordersToDelete.push({ id: d.id, data: orderData });
                    }
                });

                if (ordersToDelete.length > 0) {
                    const seatDocRef = doc(db, "posera_config", "seats");
                    
                    await runTransaction(db, async (transaction) => {
                        const seatSnap = await transaction.get(seatDocRef);
                        if(seatSnap.exists()) {
                            let seats = seatSnap.data().list;
                            let modified = false;

                            ordersToDelete.forEach(o => {
                                o.data.tickets.forEach(t => {
                                    const seatIdx = seats.findIndex(s => s.id === t.seat);
                                    if(seatIdx > -1 && seats[seatIdx].status !== 'SOLD') { 
                                        seats[seatIdx].status = 'AVAILABLE'; modified = true; 
                                    }
                                });
                            });
                            
                            if (modified) transaction.update(seatDocRef, { list: seats });
                        }
                    });

                    for (let o of ordersToDelete) {
                        await deleteDoc(doc(db, "posera_orders", o.id));
                    }
                }
            },

            resetDatabase: async () => {
                const { db, doc, setDoc, collection, getDocs, deleteDoc } = window.FB;
                
                const ordersSnap = await getDocs(collection(db, "posera_orders"));
                const deletePromises = ordersSnap.docs.map(d => deleteDoc(doc(db, "posera_orders", d.id)));
                await Promise.all(deletePromises);

                const seats = [];
                for(let i=1; i<=80; i++) seats.push({ id: `VIP-26-${String(i).padStart(3,'0')}`, cat: 'VIP', status: 'AVAILABLE' });
                for(let i=1; i<=150; i++) seats.push({ id: `REG-26-${String(i).padStart(3,'0')}`, cat: 'REGULER', status: 'AVAILABLE' });
                for(let i=1; i<=200; i++) seats.push({ id: `UM-26-${String(i).padStart(3,'0')}`, cat: 'UMUM', status: 'AVAILABLE' });
                
                await setDoc(doc(db, "posera_config", "seats"), { list: seats });
            },

            checkIn: async (token) => {
                const { db, doc, updateDoc, collection, getDocs } = window.FB;
                const snap = await getDocs(collection(db, "posera_orders"));
                let foundTicket = null;
                let foundOrderDocId = null;
                let foundOrderData = null;
                
                snap.forEach(d => {
                    const order = d.data();
                    if (order.status !== 'PAID') return;
                    const ticket = order.tickets?.find(t => t.qrToken === token);
                    if (ticket) {
                        foundTicket = ticket;
                        foundOrderDocId = d.id;
                        foundOrderData = order;
                    }
                });

                if (!foundTicket) return { success: false, msg: 'TIKET TIDAK DITEMUKAN / BELUM LUNAS' };
                if (foundTicket.status === 'USED') return { success: false, msg: 'TIKET SUDAH DIGUNAKAN', data: foundTicket };
                
                foundTicket.status = 'USED';
                foundTicket.usedAt = new Date().toISOString();
                
                await updateDoc(doc(db, "posera_orders", foundOrderDocId), { tickets: foundOrderData.tickets });
                return { success: true, msg: 'CHECK-IN BERHASIL', data: { ...foundTicket, orderName: foundOrderData.name } };
            }
        };

        // UI Components
        const Toast = ({ msg, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
            const color = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            const icon = type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle';
            return (
                <div className={`fixed bottom-5 right-5 ${color} text-white px-6 py-4 rounded-lg shadow-2xl z-[100] flex items-center gap-3 fade-in font-medium`}>
                    <i className={`fas ${icon} text-xl`}></i> {msg}
                </div>
            );
        };

        const QRCodeDisplay = ({ value }) => {
            const qrRef = useRef();
            useEffect(() => {
                if(qrRef.current && window.QRCode) {
                    qrRef.current.innerHTML = '';
                    new QRCode(qrRef.current, { text: value, width: 100, height: 100, colorDark: "#000", colorLight: "#fff" });
                }
            }, [value]);
            return <div ref={qrRef} className="p-2 bg-white rounded-lg inline-block shadow-lg mx-auto"></div>;
        };

        const BarcodeDisplay = ({ value }) => {
            const barcodeRef = useRef();
            useEffect(() => {
                if (barcodeRef.current && window.JsBarcode) {
                    window.JsBarcode(barcodeRef.current, value, {
                        format: "CODE128", width: 1.5, height: 40, displayValue: true, background: "#ffffff", lineColor: "#000000", margin: 0
                    });
                }
            }, [value]);
            return <div className="bg-white p-2 rounded-lg inline-block w-full text-center overflow-hidden"><svg ref={barcodeRef} className="max-w-full"></svg></div>;
        };

        const PaymentCountdown = ({ createdAt, onExpire }) => {
            const [timeLeft, setTimeLeft] = useState({ hours: 0, minutes: 0, seconds: 0, isExpired: false });

            useEffect(() => {
                const calculateTime = () => {
                    const createdTime = new Date(createdAt).getTime();
                    const expiryTime = createdTime + (24 * 60 * 60 * 1000); 
                    const now = new Date().getTime();
                    const difference = expiryTime - now;

                    if (difference <= 0) {
                        setTimeLeft({ hours: 0, minutes: 0, seconds: 0, isExpired: true });
                        if (onExpire) onExpire();
                    } else {
                        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                        const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                        setTimeLeft({ hours, minutes, seconds, isExpired: false });
                    }
                };

                calculateTime();
                const timer = setInterval(calculateTime, 1000);
                return () => clearInterval(timer);
            }, [createdAt]);

            if (timeLeft.isExpired) {
                return <span className="text-red-500 font-bold">Waktu Pembayaran Habis (Kadaluarsa)</span>;
            }

            return (
                <div className="flex items-center gap-2 bg-posera-red/20 border border-posera-red text-red-300 px-3 py-2 rounded-lg text-xs font-mono">
                    <i className="fas fa-clock animate-spin"></i>
                    <span>Batas Bayar: <b>{String(timeLeft.hours).padStart(2, '0')}j {String(timeLeft.minutes).padStart(2, '0')}m {String(timeLeft.seconds).padStart(2, '0')}d</b></span>
                </div>
            );
        };

        const HomeView = ({ navigate }) => (
            <div className="flex flex-col items-center justify-center min-h-screen px-4 bg-cinematic relative overflow-hidden py-10">
                <div className="absolute top-0 left-0 w-full h-full bg-[url('WhatsApp Image 2026-08-18 at 09.03.04.jpeg')] bg-cover bg-center opacity-20 blur-md pointer-events-none" onError={(e)=>{e.target.style.display='none';}}></div>
                
                <div className="fade-in z-10 w-full max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-12">
                    <div className="w-full md:w-1/2 flex justify-center md:justify-end">
                        <img src="WhatsApp Image 2026-08-18 at 09.03.04.jpeg" alt="Poster SANGKALA" className="w-full max-w-[400px] rounded-2xl shadow-[0_0_40px_rgba(212,175,55,0.4)] border-2 border-posera-gold/50 hover:scale-105 transition duration-500 object-cover" onError={(e)=>{e.target.src='https://via.placeholder.com/400x600?text=Poster+Sangkala';}} />
                    </div>
                    
                    <div className="w-full md:w-1/2 flex flex-col items-center md:items-start text-center md:text-left">
                        <div className="flex items-center gap-4 mb-4">
                            <img src="logo Semur fix.png" alt="Logo Sanggar" className="w-16 h-16 object-contain drop-shadow-md rounded-full bg-black/40 p-1 border border-posera-gold/40" onError={(e)=>{e.target.src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Ant_icon.svg/1200px-Ant_icon.svg.png';}} />
                            <div>
                                <h2 className="text-posera-gold tracking-[0.2em] text-xs md:text-sm font-semibold uppercase">Sanggar Seni Semut Merah</h2>
                                <span className="text-[10px] text-gray-400">Divisi Teater POSERA</span>
                            </div>
                        </div>
                        
                        <h1 className="text-5xl sm:text-6xl md:text-8xl font-cinematic font-bold mb-2 tracking-wider text-white drop-shadow-2xl">SANGKALA</h1>
                        <p className="text-lg sm:text-xl md:text-2xl font-cinematic text-posera-gold mb-6 italic">"Ketika masa lalu bersuara, takdir menuntut pilihan"</p>
                        
                        <div className="w-24 h-1 bg-posera-red mb-6 mx-auto md:mx-0"></div>
                        
                        <p className="text-sm sm:text-base md:text-lg font-light text-gray-300 mb-10 leading-relaxed max-w-md">
                            sebuah karya epik dari divisi teater sanggar seni semut merah yang spektakuler
                        </p>
                        
                        <div className="flex flex-col sm:flex-row gap-4 w-full justify-center md:justify-start">
                            <button onClick={() => navigate('buy')} className="bg-posera-red hover:bg-red-800 text-white px-8 py-4 rounded-lg font-bold text-lg transition-all shadow-[0_0_20px_rgba(139,0,0,0.5)] hover:scale-105 flex items-center justify-center">
                                <i className="fas fa-ticket-alt mr-2"></i> BELI TIKET
                            </button>
                            <button onClick={() => navigate('check')} className="bg-black/50 border border-gray-600 hover:border-white text-white px-8 py-4 rounded-lg font-bold text-lg transition-all backdrop-blur hover:bg-white/10 flex items-center justify-center">
                                <i className="fas fa-qrcode mr-2"></i> CEK TIKET
                            </button>
                        </div>

                        <div className="mt-12 pt-6 border-t border-gray-800/50 w-full text-center md:text-left">
                            <button onClick={() => navigate('admin')} className="text-sm text-gray-500 hover:text-posera-gold transition">
                                <i className="fas fa-lock mr-2"></i> Login Admin
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );

        const BuyTicketView = ({ navigate, setToast }) => {
            const [step, setStep] = useState(1);
            const [seats, setSeats] = useState([]);
            const [selectedCat, setSelectedCat] = useState('REGULER');
            const [selectedSeats, setSelectedSeats] = useState([]);
            const [formData, setFormData] = useState({ name: '', wa: '', email: '' });
            const [paymentMethod, setPaymentMethod] = useState('BNI');
            const [paymentProof, setPaymentProof] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [settings, setSettings] = useState({ priceVIP: 30000, priceREG: 20000, priceUM: 10000, qrisImageUrl: "qris.jpeg" });

            useEffect(() => {
                const loadData = async () => {
                    const s = await DB.getSeats();
                    const st = await DB.getSettings();
                    setSeats(s);
                    setSettings(st);
                };
                loadData();
            }, [step]);

            const prices = { VIP: settings.priceVIP, REGULER: settings.priceREG, UMUM: settings.priceUM };
            const filteredSeats = seats.filter(s => s.cat === selectedCat);
            const halfIdx = Math.ceil(filteredSeats.length / 2);
            const leftWingSeats = filteredSeats.slice(0, halfIdx);
            const rightWingSeats = filteredSeats.slice(halfIdx);

            const toggleSeat = (seat) => {
                if(seat.status === 'SOLD') return setToast('Maaf, kursi ini sudah Terjual dan Terbayar.', 'error');
                if(seat.status === 'RESERVED') return setToast('Maaf, kursi ini sedang dipesan orang lain (Menunggu Verifikasi).', 'error');
                
                if(seat.status !== 'AVAILABLE') return;
                
                if(selectedSeats.find(s => s.id === seat.id)) {
                    setSelectedSeats(selectedSeats.filter(s => s.id !== seat.id));
                } else {
                    if(selectedSeats.length >= 10) return setToast('Maksimal 10 tiket per transaksi', 'error');
                    setSelectedSeats([...selectedSeats, seat]);
                }
            };

            const getSeatColors = (seat, isSelected) => {
                if(seat.status === 'RESERVED') return 'bg-red-900 text-gray-300 border-red-950 cursor-not-allowed opacity-80';
                if(seat.status === 'SOLD') return 'bg-gray-800 text-gray-600 border-gray-900 cursor-not-allowed opacity-60';
                if(isSelected) return 'bg-posera-gold text-black border-posera-gold font-bold scale-110 shadow-[0_0_10px_rgba(212,175,55,0.6)] cursor-pointer';
                
                if(seat.cat === 'VIP') return 'border-green-600/60 text-green-500 hover:border-green-400 hover:text-green-400 hover:shadow-[0_0_12px_rgba(34,197,94,0.5)] cursor-pointer hover:scale-110';
                if(seat.cat === 'REGULER') return 'border-red-600/60 text-red-500 hover:border-red-400 hover:text-red-400 hover:shadow-[0_0_12px_rgba(239,68,68,0.5)] cursor-pointer hover:scale-110';
                if(seat.cat === 'UMUM') return 'border-yellow-600/60 text-yellow-500 hover:border-yellow-400 hover:text-yellow-400 hover:shadow-[0_0_12px_rgba(234,179,8,0.5)] cursor-pointer hover:scale-110';
                
                return 'border-gray-700 text-gray-400 cursor-pointer';
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            const MAX_HEIGHT = 800;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                            setPaymentProof(compressedDataUrl);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleCheckout = async () => {
                if(!formData.name || !formData.wa || !formData.email) return setToast('Harap lengkapi data diri', 'error');
                if(paymentMethod !== 'BOOKING' && !paymentProof) return setToast('Harap upload bukti pembayaran terlebih dahulu', 'error');
                
                setIsProcessing(true);
                try {
                    const allOrders = await DB.getOrders();
                    
                    const catPrefix = selectedCat === 'VIP' ? 'ORD-VIP-26-' : selectedCat === 'REGULER' ? 'ORD-REG-26-' : 'ORD-UM-26-';
                    let maxNum = 0;
                    
                    allOrders.forEach(o => {
                        if (o.orderId && o.orderId.startsWith(catPrefix)) {
                            const num = parseInt(o.orderId.replace(catPrefix, ''), 10);
                            if (!isNaN(num) && num > maxNum) maxNum = num;
                        }

                    const orderId = `${catPrefix}${String(maxNum + 1).padStart(3, '0')}`;
                    const total = selectedSeats.reduce((sum, seat) => sum + prices[seat.cat], 0);
                    
                    await DB.createOrder({
                        orderId, ...formData,
                        tickets: selectedSeats.map(s => ({ seat: s.id, cat: s.cat, price: prices[s.cat] })),
                        total, paymentMethod, status: 'WAITING_VERIFICATION',
                        paymentProof: paymentProof || null

                    setToast('Pesanan berhasil dibuat!', 'success');
                    navigate('success', { orderId });

                    const s = await DB.getSeats(); 
                    setSeats(s); 
                    setSelectedSeats(prev => prev.filter(pSeat => {

                        return updatedSeat && updatedSeat.status === 'AVAILABLE';

                    setIsProcessing(false);

            return (

                                            className={`px-4 py-3 rounded-xl font-bold flex-1 text-center transition-all border-2 text-xs sm:text-sm ${selectedCat === cat ? 'bg-posera-red border-posera-red text-white shadow-lg shadow-red-900/50' : 'bg-gray-900 border-gray-800 text-gray-400 hover:border-gray-600'}`}>
                                            <div>{cat}</div>
                                            <div className="text-xs sm:text-sm font-normal text-posera-gold">Rp {prices[cat].toLocaleString('id-ID')}</div>
                                        </button>
                                    ))}
                                </div>

                                <div className="bg-black/50 p-4 sm:p-6 rounded-2xl border border-gray-800">

                                        <span className="absolute -top-6 left-1/2 transform -translate-x-1/2 text-xs text-gray-400 tracking-[0.3em] font-bold">PANGGUNG UTAMA</span>
                                    </div>
                                    
                                    <div className="flex justify-between gap-2 sm:gap-4 md:gap-8 max-h-[55vh] overflow-y-auto px-1 sm:px-2 pb-4 hide-scrollbar">
                                        <div className="flex-1">
                                            <h4 className="text-center text-gray-500 text-[10px] sm:text-xs mb-4 tracking-widest uppercase border-b border-gray-800 pb-2">Sayap Kiri</h4>
                                            <div className="grid grid-cols-4 sm:grid-cols-5 gap-1.5 sm:gap-2">
                                                {leftWingSeats.map(seat => (
                                                    <div key={seat.id} onClick={() => toggleSeat(seat)} title={seat.id}
                                                        className={`seat flex flex-col justify-center items-center py-1.5 rounded text-center border font-mono ${getSeatColors(seat, selectedSeats.find(s => s.id === seat.id))}`}>

                                                        <span className="text-[10px] sm:text-[11px] font-bold leading-none">{seat.id.split('-')[2]}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        </div>

                                <div className="bg-black p-6 rounded-xl border border-gray-800 mb-4 text-center">

                                    <p className="text-2xl sm:text-3xl font-bold text-posera-gold mb-4">Rp {selectedSeats.reduce((sum, s) => sum + prices[s.cat], 0).toLocaleString('id-ID')}</p>
                                    
                                    {paymentMethod === 'BNI' && <div className="bg-gray-900 p-4 rounded-lg text-left w-full border border-gray-700"><span className="font-bold block text-white text-sm">BNI: 0264092424</span><span className="text-xs sm:text-sm text-gray-300">A.N: Dewi chandrawati</span></div>}
                                    
                                    {paymentMethod === 'QRIS' && (
                                        <div className="bg-gray-900 p-4 rounded-lg text-center w-full flex flex-col items-center border border-gray-700">
                                            <img src={settings.qrisImageUrl} alt="QRIS" className="mx-auto max-h-48 bg-white p-2 rounded mb-3 shadow" />
                                            <a 
                                                href={settings.qrisImageUrl} 
                                                download="QRIS-POSERA.jpg" 
                                                target="_blank" 
                                                rel="noopener noreferrer"
                                                className="bg-posera-gold text-black px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 hover:opacity-90 transition mb-3 shadow"
                                            >
                                                <i className="fas fa-download"></i> Simpan/Download Gambar QRIS
                                            </a>
                                            <div className="text-[11px] text-gray-300 text-left bg-black/60 p-3 rounded-lg border border-gray-800 leading-relaxed w-full">
                                                <span className="text-posera-gold font-bold block mb-1">💡 Cara Bayar di 1 HP yang Sama:</span>
                                                1. Klik tombol <b>Download Gambar QRIS</b> di atas.<br/>
                                                2. Buka aplikasi M-Banking/E-Wallet Anda.<br/>
                                                3. Pilih menu <b>QRIS / Scan</b>.<br/>
                                                4. Pilih ikon <b>Galeri / Upload</b>, lalu pilih gambar QRIS yang baru di-download.
                                            </div>
                                        </div>
                                    )}

                                    {paymentMethod === 'BOOKING' && (
                                        <div className="bg-gray-900 p-4 rounded-lg text-left w-full text-xs text-yellow-400 space-y-2 border border-yellow-600/50">
                                            <div className="font-bold flex items-center gap-2 text-sm">
                                                <i className="fas fa-exclamation-triangle"></i> PERHATIAN BOOKING TIKET:
                                            </div>
                                            <p className="text-gray-300 leading-relaxed">
                                                Tiket yang dibooking memiliki **batas waktu pembayaran maksimal 24 jam**. Jika melewati batas waktu tersebut dan belum melakukan pelunasan/konfirmasi, sistem akan otomatis membatalkan pemesanan dan kursi akan dibuka kembali untuk umum.
                                            </p>
                                        </div>
                                    )}
                                </div>

                                {paymentMethod !== 'BOOKING' && (
                                    <div className="mb-6">
                                        <label className="block text-sm text-gray-400 mb-2">Upload Bukti Pembayaran *</label>
                                        <input type="file" accept="image/*" onChange={handleFileChange} className="w-full bg-black border border-gray-700 rounded-lg p-2 text-sm text-gray-300 focus:outline-none" />
                                        <p className="text-[10px] text-gray-500 mt-1">Ukuran gambar akan otomatis dikompres untuk menghemat penyimpanan.</p>
                                    </div>
                                )}
                                
                                <button onClick={handleCheckout} disabled={isProcessing} className="w-full bg-posera-red hover:bg-red-800 text-white py-4 rounded-xl font-bold flex justify-center items-center gap-2 text-sm sm:text-base transition">
                                    {isProcessing ? <div className="loader"></div> : 'Selesaikan Pesanan'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SuccessView = ({ navigate, params }) => (
            <div className="min-h-screen flex items-center justify-center text-center px-4 bg-cinematic">
                <div className="bg-posera-gray p-8 sm:p-10 rounded-3xl border border-gray-800 max-w-lg w-full">
                    <div className="w-20 h-20 bg-green-900/30 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6"><i className="fas fa-check"></i></div>
                    <h2 className="text-2xl font-bold mb-2">Pesanan Berhasil</h2>
                    <p className="font-mono text-xl sm:text-2xl font-bold text-posera-gold mb-2 select-all">{params.orderId}</p>
                    <p className="text-gray-400 text-xs mb-8">Gunakan Order ID di atas untuk mengecek status dan e-ticket Anda.</p>
                    <button onClick={() => navigate('check', { orderId: params.orderId })} className="w-full bg-white text-black py-3 rounded-lg font-bold mb-3 text-sm sm:text-base hover:bg-gray-200 transition">Cek E-Ticket / Status</button>
                    <button onClick={() => navigate('home')} className="w-full text-gray-400 py-2 text-sm sm:text-base hover:text-white transition">Beranda</button>
                </div>
            </div>
        );

        const CheckTicketView = ({ navigate, params, setToast }) => {
            const [orderId, setOrderId] = useState(params?.orderId || '');
            const [order, setOrder] = useState(null);
            const [isCancelling, setIsCancelling] = useState(false);
            
            const handleCheck = async (e) => {
                e?.preventDefault();
                const allOrders = await DB.getOrders();
                const searchVal = orderId.toUpperCase().trim();
                
                let found = allOrders.find(o => o.orderId && o.orderId.toUpperCase() === searchVal);
                if (!found) {
                    found = allOrders.find(o => o.tickets && o.tickets.some(t => t.seat.toUpperCase() === searchVal));
                }

                if(found) {
                    if (found.paymentMethod === 'BOOKING' && found.status === 'WAITING_VERIFICATION') {
                        const createdTime = new Date(found.createdAt).getTime();
                        const expiryTime = createdTime + (24 * 60 * 60 * 1000);
                        if (new Date().getTime() > expiryTime) {
                            await DB.updateOrderStatus(found.firestoreId, found.orderId, 'EXPIRED');
                            found.status = 'EXPIRED';
                        }
                    }
                    setOrder(found);
                } else {
                    setToast('Data tidak ditemukan. Pastikan Order ID atau ID Kursi benar.', 'error');
                }
            };

            const handleCancelOrder = async () => {
                if (!confirm("Apakah Anda yakin ingin membatalkan pesanan ini? Kursi akan dikembalikan ke sistem dan terbuka untuk umum.")) return;
                setIsCancelling(true);
                try {
                    await DB.updateOrderStatus(order.firestoreId, order.orderId, 'CANCELLED');
                    setOrder(prev => ({ ...prev, status: 'CANCELLED' }));
                    setToast('Pesanan berhasil dibatalkan.', 'success');
                } catch (error) {
                    setToast('Gagal membatalkan pesanan: ' + error.message, 'error');
                } finally {
                    setIsCancelling(false);
                }
            };

            const handleDownloadTicket = async (tokenId, seatInfo) => {
                const element = document.getElementById(`ticket-${tokenId}`);
                if (element && window.html2canvas) {
                    try {
                        const canvas = await window.html2canvas(element, { 
                            backgroundColor: '#0a0a0a', 
                            scale: 2,
                            useCORS: true 
                        });
                        const image = canvas.toDataURL("image/jpeg", 0.9);
                        const link = document.createElement('a');
                        link.href = image;
                        link.download = `TIKET-SANGKALA-${seatInfo}.jpg`;
                        link.click();
                        setToast(`Tiket ${seatInfo} berhasil disimpan!`, 'success');
                    } catch (e) {
                        setToast('Gagal memproses gambar tiket', 'error');
                        console.error(e);
                    }
                } else {
                    setToast('Sistem download belum siap. Harap tunggu sebentar.', 'error');
                }
            };

            useEffect(() => { if(params?.orderId) handleCheck(); }, []);

            return (
                <div className="pt-8 pb-12 px-4 max-w-5xl mx-auto min-h-screen">
                    <nav className="mb-10 flex justify-between items-center border-b border-gray-800 pb-4">
